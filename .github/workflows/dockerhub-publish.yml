name: Docker Hub Publish

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional custom image tag. Leave empty to use the commit SHA.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dockerhub-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-images:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    if: github.ref_name == 'development' || github.ref_name == 'main'
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: main_backend
            context: backend/main_backend
            image: yashh2000/insureflow-main-backend
          - name: provider_backend
            context: backend/provider_backend
            image: yashh2000/insureflow-provider-backend
          - name: customer_app_frontend
            context: frontend/customer_app_frontend
            image: yashh2000/insureflow-customer-frontend
            build_args: |
              VITE_MAIN_API_BASE_URL=http://localhost:8000
              VITE_BOT_BASE_URL=http://localhost:8002
          - name: provider_app_frontend
            context: frontend/provider_app_frontend
            image: yashh2000/insureflow-provider-frontend
            build_args: |
              VITE_PROVIDER_API_BASE_URL=http://localhost:8001
          - name: mcp
            context: mcp
            image: yashh2000/insureflow-mcp
          - name: bot
            context: bot
            image: yashh2000/insureflow-bot

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tag
        id: image_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ matrix.service.image }}:latest
            ${{ matrix.service.image }}:${{ steps.image_tag.outputs.value }}
          build-args: ${{ matrix.service.build_args || '' }}
