name: Development CI

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build-checks:
    name: Frontend Build Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: customer_app_frontend
            working_directory: frontend/customer_app_frontend
          - name: provider_app_frontend
            working_directory: frontend/provider_app_frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app.working_directory }}/package-lock.json

      - name: Prepare frontend environment
        working-directory: ${{ matrix.app.working_directory }}
        run: cp .env.example .env

      - name: Install frontend dependencies
        working-directory: ${{ matrix.app.working_directory }}
        run: npm ci

      - name: Build frontend
        working-directory: ${{ matrix.app.working_directory }}
        run: npm run build

  python-syntax-checks:
    name: Python Syntax Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: main_backend
            path: backend/main_backend
          - name: provider_backend
            path: backend/provider_backend
          - name: mcp
            path: mcp
          - name: bot
            path: bot

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python syntax
        run: python -m compileall ${{ matrix.service.path }}

  docker-image-builds:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    needs:
      - frontend-build-checks
      - python-syntax-checks
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: main_backend
            context: backend/main_backend
            image: insureflow-main-backend
          - name: provider_backend
            context: backend/provider_backend
            image: insureflow-provider-backend
          - name: customer_app_frontend
            context: frontend/customer_app_frontend
            image: insureflow-customer-frontend
          - name: provider_app_frontend
            context: frontend/provider_app_frontend
            image: insureflow-provider-frontend
          - name: mcp
            context: mcp
            image: insureflow-mcp
          - name: bot
            context: bot
            image: insureflow-bot

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --tag local/${{ matrix.service.image }}:${{ github.sha }} \
            ${{ matrix.service.context }}
